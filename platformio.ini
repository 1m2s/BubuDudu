[platformio]
extra_configs = .pio/ports.ini

[env]
platform = platformio/espressif32@7.1.2
; Match the verified Arduino 2.0.17 / IDF 4.4.7 toolchain, including patch versions.
platform_packages =
    platformio/framework-arduinoespressif32@4.20017.260907+sha.dcc1105b
    espressif/toolchain-riscv32-esp@8.4.0+2021r2-patch5
    platformio/tool-esptoolpy@2.41100.260830
    platformio/tool-mkfatfs@2.0.1
    platformio/tool-mklittlefs@1.203.210628
    platformio/tool-mkspiffs@2.230.0
board = esp32-c3-devkitm-1
framework = arduino
lib_deps =
    adafruit/Adafruit NeoPixel@1.15.5
    olikraus/U8g2@2.36.18
extra_scripts = pre:tools/pio_select_port.py
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:bubu]
custom_device_mac = E8:F6:0A:12:4C:A4
build_flags = ${env.build_flags} -DDEVICE_BUBU

[env:dudu]
custom_device_mac = E8:F6:0A:12:5B:84
build_flags = ${env.build_flags} -DDEVICE_DUDU

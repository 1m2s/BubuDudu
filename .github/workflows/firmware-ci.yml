name: Firmware CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run host tests for both device identities
        env:
          CXX: clang++
        run: bash tests/host/run.sh

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Cache dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Keep installed platforms, libraries, build outputs, and ports.ini fresh.
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-${{ runner.arch }}-pio-6.2.0-py3.11-${{ hashFiles('platformio.ini', '.github/workflows/firmware-ci.yml') }}

      - name: Install PlatformIO Core
        run: python -m pip install 'platformio==6.2.0'

      - name: Build Bubu and Dudu firmware
        # Build-only: no upload or monitor targets. Firmware dependencies remain
        # unpinned in platformio.ini, so this is not a reproducible-build lock.
        run: pio run -e bubu -e dudu
